spring.application.name=auth-service
server.port=8081
spring.datasource.url=jdbc:postgresql://localhost:5432/driveDb
spring.datasource.username=postgres
spring.datasource.password=1234
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JWT CONFIG
jwt.secret=yourSuperSecretKeyForJwtAuthentication123456789
jwt.expiration=900000
jwt.refresh-expiration=604800000
# download links carry their own authorization in the query string, so they stay
# valid long enough to start and to resume a transfer, and no longer
jwt.download-expiration=900000

#redis config
spring.data.redis.host=localhost
spring.data.redis.port=6379
app.cookie.refresh-name=refresh_token

# Where this API is reachable from outside. Download links are built on it, so
# they have to work when opened from somewhere that is not this machine.
app.public-base-url=http://localhost:8081

# File storage (local disk)
app.storage.base-path=uploads
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
app.cors.allowed-origins=http://localhost:3000
